name: CD

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: graalvm
          cache: maven
      - name: Test
        run: ./mvnw test -Ptest-it -q
      - name: Build native image
        run: |
          IMAGE=ghcr.io/${{ github.repository }}
          ./mvnw -Pnative spring-boot:build-image -DskipTests \
            -Dspring-boot.build-image.imageName=$IMAGE:${{ github.ref_name }} -q
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        run: |
          IMAGE=ghcr.io/${{ github.repository }}
          docker tag $IMAGE:${{ github.ref_name }} $IMAGE:latest
          docker push $IMAGE:${{ github.ref_name }}
          docker push $IMAGE:latest
