name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: graalvm
          cache: maven
      - run: ./mvnw compile -q

  spotless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: graalvm
          cache: maven
      - run: ./mvnw spotless:check -Pquality -q

  arch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: graalvm
          cache: maven
      - run: ./mvnw test -Ptest-arch -q

  test-unit:
    runs-on: ubuntu-latest
    needs: [compile, spotless]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: graalvm
          cache: maven
      - run: ./mvnw test -Ptest-unit -q

  test-it:
    runs-on: ubuntu-latest
    needs: [compile, spotless]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: graalvm
          cache: maven
      - run: ./mvnw test -Ptest-it -q

  build:
    runs-on: ubuntu-latest
    needs: [test-unit, test-it]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: graalvm
          cache: maven
      - run: ./mvnw -DskipTests clean package -q
