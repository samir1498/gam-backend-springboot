name: gam-springboot

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: greenalgeria
      POSTGRES_PASSWORD: greenalgeria
      POSTGRES_DB: greenalgeria
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U greenalgeria -d greenalgeria']
      interval: 3s
      timeout: 2s
      retries: 15

  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_ACCESS_KEY: greenalgeria-access
      RUSTFS_SECRET_KEY: greenalgeria-secret-change-me
    volumes:
      - rustfs_data:/data
    ports:
      - '9000:9000'
      - '9001:9001'

  api:
    build: .
    ports:
      - '8081:8081'
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/greenalgeria
      SPRING_DATASOURCE_USERNAME: greenalgeria
      SPRING_DATASOURCE_PASSWORD: greenalgeria
      SPRING_FLYWAY_ENABLED: 'true'
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000
      APP_CLIENT_URL: http://localhost:3000
      APP_REQUIRE_EMAIL_VERIFICATION: 'false'
      STORAGE_ENDPOINT: http://rustfs:9000
      STORAGE_REGION: us-east-1
      STORAGE_BUCKET: green-algeria
      STORAGE_ACCESS_KEY: greenalgeria-access
      STORAGE_SECRET_KEY: greenalgeria-secret-change-me

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8081
    ports:
      - '3000:80'
    depends_on:
      - api

volumes:
  pgdata:
  rustfs_data:
